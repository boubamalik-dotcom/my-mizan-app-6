<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a4d52" />
    <meta
      name="description"
      content="الميزان - MIZAN AI | نظام ذكي لتقييم إجابات البكالوريا"
    />
    <meta name="keywords" content="بكالوريا, تقييم, ذكاء اصطناعي, تعليم" />
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75' fill='%231a4d52'>⚖️</text></svg>" />
    
    <!-- Apple Splash Screen -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%231a4d52' width='180' height='180'/><text x='50%' y='50%' font-size='80' fill='%23d4af37' text-anchor='middle' dominant-baseline='central'>⚖️</text></svg>" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font: Tajawal for Arabic -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet" />
    
    <style>
      * {
        font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      
      body {
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      code {
        font-family: source-code-pro, Menlo, Monaco, Consolas, 'Courier New', monospace;
      }
      
      /* Prevent zoom on iOS when clicking */
      input, textarea, select {
        font-size: 16px;
      }
      
      /* Smooth scrolling */
      html {
        scroll-behavior: smooth;
      }
    </style>
    
    <title>الميزان - MIZAN AI | تقييم ذكي للبكالوريا</title>
  </head>
  <body>
    <noscript>يتطلب تفعيل JavaScript لتشغيل هذا التطبيق.</noscript>
    <div id="root"></div>
    <!-- React and React-DOM from CDN (optional, can use npm) -->
    <script>
      // Prevent pinch zoom on mobile
      document.addEventListener('touchmove', function(event) {
        if (event.scale !== 1) {
          event.preventDefault();
        }
      }, { passive: false });
    </script>
  </body>
</html>
