# Alembic configuration for mizan_backend.
#
# Run from the `mizan_backend/` directory:
#
#   alembic upgrade head                    # apply every pending migration
#   alembic downgrade -1                    # undo the most recent one
#   alembic current                         # which revision a database is on
#   alembic history --verbose               # the full chain
#   alembic revision --autogenerate -m "…"  # draft one from model changes
#
# The database URL is deliberately NOT set here. `env.py` reads it from
# `config.Settings.database_url` (i.e. the `DATABASE_URL` environment
# variable), so migrations and the running application can never be
# pointed at two different databases by editing one of them and
# forgetting the other.

[alembic]
script_location = src/layer_5_storage/migrations

# Filenames are prefixed with a zero-padded counter so `versions/` reads
# in chronological order in a directory listing. The revision chain
# itself is defined by each script's `down_revision`, not by the name.
file_template = %%(rev)s_%%(slug)s

prepend_sys_path = .
path_separator = os

# Migrations are reviewed like any other code, so keep them formatted.
[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
